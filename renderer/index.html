<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  <title>Review GUI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="hud-grid" aria-hidden="true"></div>

  <header class="app-header">
    <div class="brand">
      <span class="brand-dot" id="brand-dot"></span>
      <h1>REVIEW&#8202;/&#8202;GUI</h1>
    </div>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" id="tab-review" role="tab" aria-selected="true">Review</button>
      <button type="button" class="tab" id="tab-tracks" role="tab" aria-selected="false">Trilhas</button>
      <button type="button" class="tab" id="tab-history" role="tab" aria-selected="false">Log</button>
    </nav>
  </header>

  <main>
    <section id="view-review" class="view">
      <div class="panel bracket" id="setup" style="--d: 0">
        <h2 class="panel-title">Repositório</h2>
        <label>
          Caminho
          <div class="input-with-buttons">
            <input type="text" id="repo-path" placeholder="C:\caminho\para\o\repo" list="recent-repos" />
            <datalist id="recent-repos"></datalist>
            <button type="button" id="browse-repo-btn" title="Escolher pasta">Procurar</button>
            <button type="button" id="reveal-repo-btn" title="Abrir no Explorer">Explorer</button>
          </div>
        </label>

        <div class="row">
          <label class="grow">
            Branch
            <select id="branch-select"></select>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="changed-only" />
            Apenas alterados
          </label>
        </div>

        <div id="branch-info" class="branch-info hidden"></div>

        <h2 class="panel-title">Arquivos</h2>
        <div class="row">
          <label class="grow">
            Pasta
            <select id="file-folder">
              <option value="">Todas as pastas</option>
            </select>
          </label>
          <label class="grow">
            Filtro glob
            <input type="text" id="file-glob" placeholder="Ex.: src/**, !**/*.test.js" />
          </label>
        </div>
        <div class="file-selection-toolbar">
          <span id="file-selection-count"></span>
          <button type="button" id="select-visible-files-btn">Selecionar visíveis</button>
          <button type="button" id="clear-file-selection-btn">Limpar seleção</button>
        </div>
        <div id="file-list" class="inset"></div>

        <div class="row">
          <label class="grow">
            Skill
            <select id="skill-select">
              <option value="general">Review geral</option>
              <option value="security">Segurança</option>
              <option value="performance">Performance</option>
              <option value="tests">Geração de testes</option>
              <option value="style">Refactor de estilo</option>
            </select>
          </label>

          <label class="grow">
            Intensidade
            <select id="intensity-select">
              <option value="quick">Rápido</option>
              <option value="full" selected>Completo</option>
            </select>
          </label>
        </div>

        <label>
          Trilha de validação
          <select id="track-select">
            <option value="">Execução única</option>
          </select>
        </label>

        <div class="actions">
          <button id="load-branches-btn">Carregar branches</button>
          <button id="load-files-btn">Carregar arquivos</button>
          <button id="run-btn" class="primary">Executar análise</button>
          <button id="run-track-btn">Executar trilha</button>
        </div>
      </div>

      <div class="hud-core" id="hud-core" style="--d: 1">
        <svg viewBox="0 0 120 120" class="core-ring">
          <circle class="ring-track" cx="60" cy="60" r="52" />
          <circle class="ring-ticks" cx="60" cy="60" r="44" />
          <circle class="ring-sweep" cx="60" cy="60" r="52" />
        </svg>
        <div class="core-readout">
          <div class="core-value" id="core-value">--</div>
          <div class="core-label" id="core-label">Standby</div>
        </div>
      </div>

      <div id="status" class="status"></div>

      <section id="phase-results"></section>
      <section id="results"></section>
    </section>

    <section id="view-tracks" class="view hidden">
      <div class="panel bracket" style="--d: 0">
        <h2 class="panel-title">Trilha de validação</h2>
        <label>
          Nome
          <input type="text" id="track-name" placeholder="Ex.: Pré-merge" maxlength="100" />
        </label>
        <p class="helper-text">As fases usam o mesmo snapshot de branch e arquivos. Comandos de teste são executados no working tree atual: não salve segredos nos argumentos.</p>
        <div id="track-phase-list"></div>
        <div class="actions">
          <button id="new-track-btn">Nova trilha</button>
          <button id="add-phase-btn">Adicionar fase</button>
          <button id="save-track-btn" class="primary">Salvar trilha</button>
          <button id="delete-track-btn">Excluir trilha</button>
        </div>
      </div>
      <div class="panel bracket" style="--d: 1">
        <h2 class="panel-title">Trilhas salvas</h2>
        <div id="track-list"></div>
      </div>
    </section>

    <section id="view-history" class="view hidden">
      <div class="panel bracket" id="history-summary" style="--d: 0"></div>
      <div id="history-list"></div>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
