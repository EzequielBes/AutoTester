<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'" />
  <title>Review GUI</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <header class="app-header">
    <h1>Review GUI</h1>
    <nav class="tabs" role="tablist">
      <button type="button" class="tab active" id="tab-review" role="tab" aria-selected="true">Review</button>
      <button type="button" class="tab" id="tab-history" role="tab" aria-selected="false">Histórico</button>
    </nav>
  </header>

  <main>
    <section id="view-review" class="view">
      <div class="glass-panel" id="setup">
        <label>
          Repositório
          <input type="text" id="repo-path" placeholder="C:\caminho\para\o\repo" />
        </label>

        <div class="row">
          <label class="grow">
            Branch
            <select id="branch-select"></select>
          </label>
          <label class="checkbox-label">
            <input type="checkbox" id="changed-only" />
            Só arquivos alterados na branch
          </label>
        </div>

        <div id="branch-info" class="branch-info hidden"></div>

        <div id="file-list" class="glass-inset"></div>

        <div class="row">
          <label class="grow">
            Skill
            <select id="skill-select">
              <option value="general">Review geral</option>
              <option value="security">Segurança</option>
              <option value="performance">Performance</option>
              <option value="tests">Geração de testes</option>
              <option value="style">Refactor de estilo</option>
            </select>
          </label>

          <label class="grow">
            Intensidade
            <select id="intensity-select">
              <option value="quick">Rápido</option>
              <option value="full" selected>Completo</option>
            </select>
          </label>
        </div>

        <div class="actions">
          <button id="load-branches-btn">Carregar branches</button>
          <button id="load-files-btn">Carregar arquivos</button>
          <button id="run-btn" class="primary">Rodar análise</button>
        </div>
      </div>

      <div id="status" class="status"></div>

      <section id="results"></section>
    </section>

    <section id="view-history" class="view hidden">
      <div class="glass-panel" id="history-summary"></div>
      <div id="history-list"></div>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
